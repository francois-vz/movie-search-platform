[project]
name = "movie-search-mcp"
version = "0.1.0"
description = "FastMCP server exposing semantic movie search tools over pgvector."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pgvector", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src", "src.server"]

[tool.setuptools.package-data]
"src.server" = ["sql/*.sql"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
