# ============================================================================
# Movie Search Platform — local orchestration
# Bring up the entire platform:  docker compose up --build
# Run the one-shot data pipeline:  docker compose run --rm pipeline
# ============================================================================

x-common-env: &common-env
  env_file:
    - .env

services:
  # ---- PostgreSQL 16 + pgvector ---------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- DB migrations (Flyway) -----------------------------------------------
  # Applies database/migrations on a healthy postgres. After editing V1/V2
  # locally: docker compose down -v  (Flyway versions are forward-only).
  migrate:
    image: flyway/flyway:10.22.0
    <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD}
      -connectRetries=10 migrate

  # ---- Embedding model server (own container) -------------------------------
  # Ollama serving nomic-embed-text (768-dim). The entrypoint starts the server,
  # pulls the model once (cached in the named volume), then keeps serving.
  embeddings:
    image: ollama/ollama:0.6.8
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ${EMBEDDING_MODEL}
        wait
    ports:
      - "8001:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # Healthy only once the model is actually pulled and listed.
      test: ["CMD-SHELL", "ollama list | grep -q ${EMBEDDING_MODEL}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---- Data pipeline (runs and exits) ---------------------------------------
  # Part of the default `docker compose up --build`: it waits for postgres,
  # migrate and embeddings, ingests and embeds the dataset, then exits 0. Being
  # idempotent (1.5 upserts on the natural key), a repeat `up` is a no-op.
  #
  # Re-run on demand:  docker compose run --rm pipeline
  # Transform only (1.1-1.3, no database or embedding server):
  #   docker compose run --rm --no-deps pipeline --dry-run
  pipeline:
    build: ./pipeline
    restart: "no"
    <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

  # ---- Python MCP server (FastMCP) ------------------------------------------
  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- .NET 10 Web API ------------------------------------------------------
  api:
    build: ./api
    restart: unless-stopped
    <<: *common-env
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Observability --------------------------------------------------------
  # Healthchecks use busybox `wget --spider`: none of these images ship curl
  # except grafana, but all three ship wget.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    healthcheck:
      # 14269 is the admin port; it reports "Server available" once collectors are up.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Embedding visualization (bonus, Part 5) ------------------------------
  # Reader only: polls until the 1.5 loader has written embeddings, exports
  # Parquet, then serves Embedding Atlas. Deliberately no depends_on pipeline:
  # the wait loop already covers ordering, and polling keeps atlas reachable
  # (logging what it is waiting for) even when a pipeline run fails.
  atlas:
    build:
      context: .
      dockerfile: scripts/atlas/Dockerfile
    restart: unless-stopped
    <<: *common-env
    ports:
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  pgdata:
  ollama:

# Single user-defined bridge network for the whole platform. Naming the default
# network keeps every service on one DNS namespace without repeating a
# `networks:` key on each service.
networks:
  default:
    name: movie-search
