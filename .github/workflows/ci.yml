name: CI

on:
  pull_request:
    branches: [main]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: setup-python 3.12; ruff check; mypy; pytest for pipeline + mcp-server

  dotnet-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MovieSearch.sln
      - name: Format
        run: dotnet format MovieSearch.sln --verify-no-changes --no-restore
      - name: Test
        run: dotnet test MovieSearch.sln --configuration Release --no-restore

  docker-build-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: docker compose build; docker compose up -d; run integration smoke test

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: terraform fmt -check; init -backend=false; validate; plan (dev)
