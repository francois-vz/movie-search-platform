[project]
name = "movie-search-pipeline"
version = "0.1.0"
description = "Data pipeline: clean, impute, augment, embed the Vega movies dataset into pgvector."
requires-python = ">=3.12"
dependencies = [
    "vega-datasets>=0.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["src", "src.pipeline"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
